# Local stack. `docker compose up -d db` is enough for development (API/web run on the host).
# `docker compose --profile full up --build` runs everything in containers.
name: intervueai
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intervue
      POSTGRES_PASSWORD: intervue_local_dev
      POSTGRES_DB: intervue
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervue"]
      interval: 3s
      retries: 20

  worker:
    profiles: ["full"]
    build: { context: ../.., dockerfile: infra/docker/worker.Dockerfile }
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:-change-me-worker-token}
      EXECUTION_BACKEND: docker
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    ports: ["8101:8101"]

  api:
    profiles: ["full"]
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    env_file: [../../.env]
    environment:
      DATABASE_URL: postgresql+psycopg://intervue:intervue_local_dev@db:5432/intervue
      WORKER_URL: http://worker:8101
    depends_on: { db: { condition: service_healthy } }
    ports: ["8100:8100"]

  web:
    profiles: ["full"]
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:8100
      NEXT_PUBLIC_WS_URL: ws://localhost:8100
    ports: ["3000:3000"]

volumes:
  pgdata:
