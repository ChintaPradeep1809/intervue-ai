[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intervue_voice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "edge-tts>=7.0"]

[tool.setuptools.packages.find]
include = ["intervue_voice*"]

[tool.setuptools.package-data]
"*" = ["data/*.json", "py.typed"]
