[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intervue_security"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["intervue_security*"]

[tool.setuptools.package-data]
"*" = ["data/*.json", "py.typed"]
