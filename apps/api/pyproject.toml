[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intervue-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2",
  "aiosqlite>=0.20", "pydantic>=2.7", "pydantic-settings>=2.3", "email-validator>=2.1", "python-multipart>=0.0.9",
  "pypdf>=4.0", "python-docx>=1.1", "pillow>=10.0", "httpx>=0.27", "anthropic>=1.0", "openai>=1.60", "boto3>=1.34",
  "intervue_ai", "intervue_engine", "intervue_eval", "intervue_coding", "intervue_voice", "intervue_security",
]

[tool.setuptools.packages.find]
include = ["app*"]
